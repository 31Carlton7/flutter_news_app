name: canton_news_app
description: A Flutter news aggregation app using the News API.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  canton_design_system:
    git:
      url: https://github.com/31Carlton7/canton_design_system.git
      ref: master

  # State Management
  flutter_riverpod: ^0.14.0+3

  # API
  dio: ^4.0.0
  flutter_easyrefresh: ^2.2.1

  # Other
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
